<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hubBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="hubCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hubGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="hubCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Frame -->
  <rect x="25" y="25" width="450" height="450" rx="110" fill="#0F172A"/>
  
  <!-- Subtle Internal Rim Glow -->
  <rect x="27" y="27" width="446" height="446" rx="108" fill="none" stroke="url(#hubBgGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Orbital Rings -->
  <circle cx="250" cy="250" r="140" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  <circle cx="250" cy="250" r="95" stroke="url(#hubBgGrad)" stroke-width="8" stroke-opacity="0.8"/>

  <!-- Satellite Connection Beams -->
  <!-- Top Node -->
  <line x1="250" y1="250" x2="250" y2="110" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.8"/>
  <!-- Bottom Right Node -->
  <line x1="250" y1="250" x2="370" y2="320" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.8"/>
  <!-- Bottom Left Node -->
  <line x1="250" y1="250" x2="130" y2="320" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.8"/>

  <!-- Central Relay Hub Core -->
  <circle cx="250" cy="250" r="42" fill="url(#hubCoreGrad)" filter="url(#softGlow)"/>
  <circle cx="250" cy="250" r="22" fill="#FFFFFF"/>
  <circle cx="250" cy="250" r="12" fill="#4F46E5"/>

  <!-- Satellite Nodes (3 Key Pillars: Big-Tech AI, Clean Relay, Zero-Ban Security) -->
  <!-- 1. Top Satellite (Cyan - Speed & Relay) -->
  <circle cx="250" cy="110" r="28" fill="url(#hubCyanGrad)"/>
  <circle cx="250" cy="110" r="14" fill="#FFFFFF"/>
  <circle cx="250" cy="110" r="7" fill="#0F172A"/>

  <!-- 2. Bottom Right Satellite (Purple - Intelligence) -->
  <circle cx="370" cy="320" r="28" fill="url(#hubBgGrad)"/>
  <circle cx="370" cy="320" r="14" fill="#FFFFFF"/>
  <circle cx="370" cy="320" r="7" fill="#0F172A"/>

  <!-- 3. Bottom Left Satellite (Rose - Safety Shield) -->
  <circle cx="130" cy="320" r="28" fill="url(#hubGlowGrad)"/>
  <circle cx="130" cy="320" r="14" fill="#FFFFFF"/>
  <circle cx="130" cy="320" r="7" fill="#0F172A"/>
</svg>
